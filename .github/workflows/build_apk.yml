name: Build & Release Universal APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.2.7)'
        required: false
        default: '1.2.7'
      build_number:
        description: 'Build Number (e.g. 37)'
        required: false
        default: '37'

concurrency:
  group: pocket-release-pipeline
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Release Universal APK (Turbo)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"

    steps:
      - name: Fast Shallow Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Version Info
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
            BUILD_NUMBER="${{ github.run_number }}"
            VERSION_TAG="${TAG_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.version_name }}" != "" ]]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
            VERSION_TAG="v${VERSION_NAME}"
          else
            VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
            BUILD_NUMBER="${{ github.run_number }}"
            VERSION_TAG="v${VERSION_NAME}"
          fi
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building Version: $VERSION_NAME+$BUILD_NUMBER ($VERSION_TAG)"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-install Android SDK Tools & NDK
        run: |
          yes | sdkmanager --licenses || true
          for i in 1 2 3; do
            echo "Attempt $i: Installing NDK and CMake..."
            sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" && break || {
              echo "Installation glitch, cleaning up partial download before retrying..."
              rm -rf /usr/local/lib/android/sdk/.temp /usr/local/lib/android/sdk/ndk/27.0.12077973 2>/dev/null || true
              sleep 5
            }
          done

      - name: Setup Fast Gradle Cache & Build Action
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Flutter Environment (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Fast Static Analysis
        continue-on-error: true
        run: |
          echo "### 🔍 Flutter Analyze Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          flutter analyze --no-fatal-infos 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Tests
        run: flutter test test/
        continue-on-error: true

      - name: Configure Production Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/pocket-release-key.jks
          fi
          echo "storePassword=pocketrelease2026" > android/key.properties
          echo "keyPassword=pocketrelease2026" >> android/key.properties
          echo "keyAlias=pocket_key" >> android/key.properties
          echo "storeFile=../app/pocket-release-key.jks" >> android/key.properties

      - name: Turbo Universal Release APK Build (Signed)
        run: |
          set -e -o pipefail
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
          flutter build apk --release --no-pub --tree-shake-icons \
            --android-skip-build-dependency-validation \
            --build-name="${{ steps.versioning.outputs.VERSION_NAME }}" \
            --build-number="${{ steps.versioning.outputs.BUILD_NUMBER }}" 2>&1 | tee /tmp/flutter_build.log || {
              EXIT_CODE=$?
              echo "### ❌ Build APK Error Log (Exit Code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 120 /tmp/flutter_build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit $EXIT_CODE
            }

      - name: Package APK for Distribution
        run: |
          mkdir -p dist/
          echo "Searching for generated release APKs..."
          APK_FILE=$(find build/ android/app/build/ -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find build/ android/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Could not find generated APK file!"
            echo "Listing all files in build/:"
            find build/ -maxdepth 5 2>/dev/null || true
            echo "Listing all files in android/app/build/:"
            find android/app/build/ -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          echo "Found APK at: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"
          cp "$APK_FILE" "dist/Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk"
          cp "$APK_FILE" "dist/Pocket-latest.apk"
          ls -lh dist/

      - name: Upload Universal APK Artifact (Fast)
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-APK
          path: dist/*.apk
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: dist/*.apk
          name: Pocket ${{ steps.versioning.outputs.VERSION_TAG }}
          tag_name: ${{ steps.versioning.outputs.VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Rich Release Summary
        run: |
          echo "## 🚀 Pocket ${{ steps.versioning.outputs.VERSION_TAG }} Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.versioning.outputs.VERSION_NAME }}+${{ steps.versioning.outputs.BUILD_NUMBER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Tag** | [\`${{ steps.versioning.outputs.VERSION_TAG }}\`](https://github.com/${{ github.repository }}/releases/tag/${{ steps.versioning.outputs.VERSION_TAG }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Universal APK** | \`Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Direct APK** | \`Pocket-latest.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Release APK" >> $GITHUB_STEP_SUMMARY
          echo "- 👉 [**Download Versioned (${{ steps.versioning.outputs.VERSION_TAG }})**](https://github.com/${{ github.repository }}/releases/download/${{ steps.versioning.outputs.VERSION_TAG }}/Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- 👉 [**Download Latest Direct APK**](https://github.com/${{ github.repository }}/releases/latest/download/Pocket-latest.apk)" >> $GITHUB_STEP_SUMMARY

