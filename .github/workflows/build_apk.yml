name: Build & Release Universal APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.8)'
        required: false
        default: '1.0.8'
      build_number:
        description: 'Build Number (e.g. 8)'
        required: false
        default: '8'

concurrency:
  group: pocket-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Release Universal APK (Turbo)
    runs-on: ubuntu-latest

    steps:
      - name: Fast Shallow Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Version Info
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
            BUILD_NUMBER="${{ github.run_number }}"
            VERSION_TAG="${TAG_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.version_name }}" != "" ]]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
            VERSION_TAG="v${VERSION_NAME}"
          else
            VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
            BUILD_NUMBER="${{ github.run_number }}"
            VERSION_TAG="v${VERSION_NAME}"
          fi
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building Version: $VERSION_NAME+$BUILD_NUMBER ($VERSION_TAG)"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Fast Gradle Cache & Build Action
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Dependencies & Native Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Install Dependencies
        run: flutter pub get

      - name: Quick Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Tests in Parallel
        run: flutter test --concurrency=4

      - name: Configure Production Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/pocket-release-key.jks
          fi
          if [ ! -f android/key.properties ]; then
            echo "storePassword=${{ secrets.STORE_PASSWORD || 'pocketrelease2026' }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD || 'pocketrelease2026' }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS || 'pocket_key' }}" >> android/key.properties
            echo "storeFile=../app/pocket-release-key.jks" >> android/key.properties
          fi

      - name: Turbo Universal Release APK Build (Signed)
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
          flutter build apk --release --no-pub --tree-shake-icons \
            --build-name="${{ steps.versioning.outputs.VERSION_NAME }}" \
            --build-number="${{ steps.versioning.outputs.BUILD_NUMBER }}"

      - name: Package APK for Distribution
        run: |
          mkdir -p dist/
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk"

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-APK
          path: dist/Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk
          name: Pocket ${{ steps.versioning.outputs.VERSION_TAG }}
          tag_name: ${{ steps.versioning.outputs.VERSION_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
