name: Release Universal APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      build_number:
        description: 'Build Number (e.g. 1)'
        required: false
        default: '1'

# Cancel obsolete in-flight runs
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build_and_release:
    name: Build & Package Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Fast Shallow Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Version Info
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME=$(echo "$TAG_NAME" | cut -d'+' -f1)
            BUILD_NUMBER="${{ github.run_number }}"
            echo "VERSION_TAG=v${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
            echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.version_name }}" != "" ]]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
            echo "VERSION_TAG=v${VERSION_NAME}" >> $GITHUB_OUTPUT
            echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
            echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          else
            VERSION_NAME="1.0.0"
            BUILD_NUMBER="${{ github.run_number }}"
            echo "VERSION_TAG=v1.0.0" >> $GITHUB_OUTPUT
            echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
            echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          fi
          echo "Building Release: $VERSION_NAME+$BUILD_NUMBER ($VERSION_TAG)"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Fast Gradle Cache & Daemon
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Dependencies & Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Tests in Parallel
        run: flutter test --concurrency=4

      - name: Fast Universal Release APK Build
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
          flutter build apk --release --no-pub \
            --build-name="${{ steps.versioning.outputs.VERSION_NAME }}" \
            --build-number="${{ steps.versioning.outputs.BUILD_NUMBER }}"

      - name: Package APK for Distribution
        run: |
          mkdir -p dist/
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk"

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-APK
          path: dist/Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pocket-${{ steps.versioning.outputs.VERSION_TAG }}-universal.apk
          name: Pocket ${{ steps.versioning.outputs.VERSION_TAG }}
          tag_name: ${{ steps.versioning.outputs.VERSION_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
