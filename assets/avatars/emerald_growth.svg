<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Void -->
    <radialGradient id="emeraldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#042a1e"/>
      <stop offset="70%" stop-color="#021710"/>
      <stop offset="100%" stop-color="#010a07"/>
    </radialGradient>

    <!-- Outer Emerald Aura -->
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Glass Sphere Body -->
    <radialGradient id="emeraldSphere" cx="34%" cy="30%" r="66%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#059669" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#064e3b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#022118" stop-opacity="0.98"/>
    </radialGradient>

    <!-- Internal Mint Growth Core -->
    <radialGradient id="mintCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a7f3d0"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Top Specular Highlight -->
    <linearGradient id="emeraldSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Rim Bounce Light -->
    <linearGradient id="emeraldRim" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>

    <!-- Orbital Prism Arc -->
    <linearGradient id="emeraldPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Base Circle & Ambient Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#emeraldBg)"/>
  <circle cx="50" cy="50" r="46" fill="url(#emeraldAura)"/>

  <!-- Back Portion of Gyroscopic Ring -->
  <path d="M 20 38 C 24 22, 54 18, 76 30 C 86 36, 88 48, 80 56" 
        fill="none" stroke="url(#emeraldPrism)" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Main 3D Emerald Glass Sphere -->
  <circle cx="50" cy="50" r="36" fill="url(#emeraldSphere)"/>

  <!-- Luminous Inner Growth Core -->
  <circle cx="49" cy="49" r="14" fill="url(#mintCore)"/>

  <!-- Concentric Bio-Luminescent Pulse Rings -->
  <circle cx="49" cy="49" r="18" fill="none" stroke="#6ee7b7" stroke-width="0.9" opacity="0.5"/>
  <circle cx="49" cy="49" r="23" fill="none" stroke="#34d399" stroke-width="0.6" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Prismatic Crystal Shards / Growth Petals -->
  <polygon points="49,30 53,45 68,49 53,53 49,68 45,53 30,49 45,45" fill="#a7f3d0" opacity="0.8"/>
  <polygon points="49,37 51,46 61,49 51,52 49,61 47,52 37,49 47,46" fill="#ffffff" opacity="0.9"/>
  <circle cx="49" cy="49" r="3" fill="#ffffff"/>

  <!-- Front Segment of Gyroscopic Ring -->
  <path d="M 80 56 C 72 66, 46 78, 24 66 C 16 62, 14 50, 20 38" 
        fill="none" stroke="url(#emeraldPrism)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Frosted Glass Surface Refraction Arc -->
  <path d="M 23 44 C 26 28, 44 19, 64 22" 
        fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Primary Specular Top Highlight -->
  <ellipse cx="43" cy="27" rx="15" ry="8" transform="rotate(-22 43 27)" fill="url(#emeraldSpecular)"/>

  <!-- Secondary Specular Sparkle -->
  <circle cx="59" cy="25" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Bottom Emerald Rim Bounce Reflection -->
  <path d="M 31 75 C 43 83, 60 81, 69 72" 
        fill="none" stroke="url(#emeraldRim)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Outer Glass Frame Ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#emeraldPrism)" stroke-width="1.2" opacity="0.8"/>
</svg>
